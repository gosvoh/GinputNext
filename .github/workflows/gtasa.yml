name: GInputNext GTASA x86
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    env:
      PLUGIN_SDK_DIR: ${{ github.workspace }}\plugin-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: DK22Pac/plugin-sdk
          ref: 624a6a49265fd7a6fc63bda1611013ceabeacb8a
          path: plugin-sdk
          persist-credentials: false
      - name: Locate VS 2022 v143
        id: vs
        shell: pwsh
        run: |
          $finder = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $finder -version '[17.0,18.0)' -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'Visual Studio 2022 missing' }
          "VS_INSTALL=$vs" >> $env:GITHUB_ENV
          "$vs\MSBuild\Current\Bin" >> $env:GITHUB_PATH
          $version = (Get-Content "$vs\VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt").Trim()
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: actions/cache@v4
        id: deps
        with:
          path: |
            plugin-sdk/output/lib/plugin.lib
            third_party/SDL2-2.32.10
            third_party/SDL_GameControllerDB
          key: gtasa-win32-${{ steps.vs.outputs.version }}-${{ hashFiles('.github/workflows/gtasa.yml', 'tools/FETCH*.ps1', 'PREPARE_DEPS.bat') }}
      - name: Generate and build Plugin-SDK for San Andreas
        if: steps.deps.outputs.cache-hit != 'true'
        working-directory: plugin-sdk/tools/premake
        shell: pwsh
        run: |
          .\premake5.exe vs2022
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          msbuild "$env:PLUGIN_SDK_DIR\plugin_sa\plugin_sa.vcxproj" /m /v:minimal /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143
      - run: PREPARE_DEPS.bat --no-pause
        shell: cmd
      - run: python tests/test_windows_mapping.py third_party/SDL_GameControllerDB/gamecontrollerdb.txt
      - name: Exercise Dual Action through SDL2 and ControllerCore
        shell: cmd
        run: |
          call "%VS_INSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x86 -host_arch=x64 || exit /b 1
          set "SDL=%CD%\third_party\SDL2-2.32.10"
          mkdir input-test
          copy "%SDL%\lib\x86\SDL2.dll" input-test || exit /b 1
          copy third_party\SDL_GameControllerDB\gamecontrollerdb.txt input-test\GInputNext.gamecontrollerdb.txt || exit /b 1
          cl /nologo /std:c++17 /EHsc /MT /DNOMINMAX /Isrc /I"%SDL%\include" tests\dual_action_virtual.cpp src\ControllerCore.cpp src\SDL2Dyn.cpp src\Log.cpp "%SDL%\lib\x86\SDL2.lib" /Fe:input-test\input-test.exe || exit /b 1
          input-test\input-test.exe "%CD%\input-test"
      - run: BUILD_GTASA.bat --no-pause
        shell: cmd
      - name: Package runtime files and notices
        shell: pwsh
        run: |
          $dist = 'dist/GTASA/GInputNext'
          mkdir package, package/licenses
          foreach ($file in 'GInputNext.asi','GInputNext.SDL2.dll','GInputNext.ini','GInputNext.gamecontrollerdb.txt') {
            Copy-Item "$dist/$file" package
          }
          Copy-Item README.ru.md, THIRD_PARTY_NOTICES.md package
          Copy-Item LICENSE package/licenses/GInputNext.txt
          Copy-Item third_party/SDL2-2.32.10/LICENSE.txt package/licenses/SDL2.txt
          Copy-Item licenses/* package/licenses
          Copy-Item plugin-sdk/LICENSE package/licenses/Plugin-SDK.txt
          Copy-Item plugin-sdk/hooking/LICENSE.md package/licenses/Hooking.md
          Copy-Item plugin-sdk/safetyhook/LICENSE.txt package/licenses/SafetyHook.txt
          Compress-Archive package/* GInputNext-GTASA.zip
          Get-FileHash GInputNext-GTASA.zip
      - uses: actions/upload-artifact@v7
        with:
          archive: false
          path: GInputNext-GTASA.zip
          if-no-files-found: error
